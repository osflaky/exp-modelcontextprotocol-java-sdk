name: CI

on:
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
      fail-fast: false
      max-parallel: 6
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build
      run: mvn verify

    timeout-minutes: 150
